# iCard static content. The manifest is always revalidated; versioned pack files
# can be cached because a changed pack must receive a new version and checksum.
location = /icard-content {
    return 308 /icard-content/;
}

location = /icard-content/v1/manifest.json {
    alias /var/www/icard-content/current/v1/manifest.json;
    default_type application/json;
    expires -1;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /icard-content/ {
    alias /var/www/icard-content/current/;
    index index.html;
    autoindex off;
    expires 1h;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
